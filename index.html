<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMU Parking Heatmap V2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f8f6;
    color: #222;
    padding: 2rem;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    border: 0.5px solid rgba(0,0,0,0.12);
    padding: 2rem;
    max-width: 1120px;
    margin: 0 auto;
    width: 100%;
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 4px; color: #111; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  .controls { display: flex; gap: 8px; margin-bottom: 14px; }
  .controls button {
    font-size: 13px; padding: 5px 16px; border-radius: 8px;
    border: 0.5px solid rgba(0,0,0,0.2); background: transparent;
    cursor: pointer; transition: background 0.15s; color: #333;
  }
  .controls button:hover { background: #f0f0ee; }
  .controls button.on { background: #f0f0ee; font-weight: 500; }
  .legend { display: flex; align-items: center; margin-bottom: 12px; }
  .lb { height: 12px; flex: 1; }
  .ll { font-size: 12px; color: #888; padding: 0 6px; }
  canvas { display: block; max-width: 100%; }
  #info { font-size: 13px; color: #888; margin-top: 10px; min-height: 20px; }
  .grade-legend { display: flex; gap: 8px; margin-top: 16px; }
  .grade-badge { font-size: 12px; padding: 3px 10px; border-radius: 5px; color: #fff; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <h1>KMU Parking Heatmap V2</h1>
  <p class="subtitle">연결구(엘리베이터·통로)까지의 거리 기반 등급 분류</p>
  <div class="controls">
    <button id="bE" class="on" onclick="_sm('E')">직선 거리</button>
    <button id="bW" onclick="_sm('W')">보행 거리</button>
  </div>
  <div class="legend">
    <span class="ll">접근성 좋음</span>
    <div class="lb" style="background:#2563eb"></div>
    <div class="lb" style="background:#93c5fd"></div>
    <div class="lb" style="background:#fca5a5"></div>
    <div class="lb" style="background:#dc2626"></div>
    <span class="ll">접근성 나쁨</span>
  </div>
  <canvas id="pv"></canvas>
  <div id="info"></div>
  <div class="grade-legend">
    <span class="grade-badge" style="background:#2563eb">A</span>
    <span class="grade-badge" style="background:#93c5fd;color:#1e3a8a">B</span>
    <span class="grade-badge" style="background:#fca5a5;color:#7f1d1d">C</span>
    <span class="grade-badge" style="background:#dc2626">D</span>
  </div>
</div>
<script>
(function(){
const sw=18,sh=36,bd=6,ah=24,aw=15,cAW=21;

const lWW=sh;
const liX=lWW+aw;
const leX=liX+20*sw;
const cAX=leX+sh;
const reX=cAX+cAW;
const riX=reX+sh;

const topLastEnd=liX+41*sw-1;
const botRightStart=468;
const botRightLastEnd=botRightStart+21*sw-1;
const GAP=sw;
const RX_elev=topLastEnd+GAP;
const RX_mir=botRightLastEnd+GAP;
const lotW=RX_mir+21;

const isTopY=[sh+ah,sh+ah+(sh+bd+sh+ah),sh+ah+2*(sh+bd+sh+ah)];
const isBotY=isTopY.map(y=>y+sh+bd);
const bAY=isBotY[2]+sh;
const bWY=bAY+ah;
const lotH=bWY+sh;
const endOff=(sh+bd+sh-3*sw)/2;
const wk1x=459;
const botLeft2Start=126;

const cnPx=[
  {x:lWW/2,     y:sh/2,     n:'엘리베이터 (운동장, 좌)'},
  {x:RX_elev,   y:sh/2,     n:'엘리베이터 (운동장, 우)'},
  {x:6*sw+sw/2, y:bWY+sh/2, n:'복지관 통로 2'},
  {x:wk1x,      y:bWY+sh/2, n:'복지관 통로 1'},
  {x:RX_mir,    y:bWY+sh/2, n:'미래관 통로'},
];

const GW=50,GH=15,WALL=2,SPOT=1;
const g=Array.from({length:GH},()=>new Uint8Array(GW));
const fill=(x0,y0,x1,y1,v)=>{
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++)
    if(x>=0&&x<GW&&y>=0&&y<GH) g[y][x]=v;
};
for(let y=0;y<GH;y++){g[y][0]=WALL;g[y][49]=WALL;}
[3,7,11].forEach(by=>{fill(3,by,22,by,WALL);fill(30,by,46,by,WALL);});
fill(3,0,43,0,SPOT);fill(1,1,1,13,SPOT);
[2,6,10].forEach(ty=>{
  fill(3,ty,22,ty,SPOT);fill(3,ty+2,22,ty+2,SPOT);
  fill(23,ty,25,ty+2,SPOT);fill(27,ty,29,ty+2,SPOT);
  fill(30,ty,46,ty,SPOT);fill(30,ty+2,46,ty+2,SPOT);
});
fill(1,14,6,14,SPOT);fill(8,14,25,14,SPOT);fill(27,14,46,14,SPOT);

const LGCONS=[{x:1,y:0},{x:46,y:0},{x:7,y:14},{x:26,y:14},{x:48,y:14}];
function makeBFS(){
  const d=Array.from({length:GH},()=>new Uint16Array(GW).fill(9999));
  const q=[];
  LGCONS.forEach(c=>{d[c.y][c.x]=0;q.push([c.x,c.y]);});
  const D=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let h=0;h<q.length;h++){
    const[cx,cy]=q[h],cd=d[cy][cx];
    for(const[dx,dy]of D){
      const nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<GW&&ny>=0&&ny<GH&&g[ny][nx]!==WALL&&d[ny][nx]===9999){
        d[ny][nx]=cd+1;q.push([nx,ny]);
      }
    }
  }
  return d;
}
const BD=makeBFS();

const spots=[];
const add=(px,py,pw,ph,gx,gy)=>spots.push({px,py,pw,ph,cx:px+pw/2,cy:py+ph/2,gx,gy});

for(let i=0;i<41;i++) add(liX+i*sw,0,sw-1,sh-1,3+i,0);
for(let i=0;i<17;i++) add(0,sh+i*sw,lWW-1,sw-1,1,1+Math.round(i*12/16));
[0,1,2].forEach(j=>{
  const ty=isTopY[j],by=isBotY[j],lgy=[2,6,10][j],ey=ty+endOff;
  for(let i=0;i<20;i++){
    add(liX+i*sw,ty,sw-1,sh-1,3+i,lgy);
    add(liX+i*sw,by,sw-1,sh-1,3+i,lgy+2);
  }
  for(let k=0;k<3;k++){
    add(leX,ey+k*sw,sh-1,sw-1,25-k,lgy+k);
    add(reX,ey+k*sw,sh-1,sw-1,27+k,lgy+k);
  }
  for(let i=0;i<17;i++){
    add(riX+i*sw,ty,sw-1,sh-1,30+i,lgy);
    add(riX+i*sw,by,sw-1,sh-1,30+i,lgy+2);
  }
});
for(let i=0;i<6;i++)  add(i*sw,bWY,sw-1,sh-1,1+i,14);
for(let i=0;i<18;i++) add(botLeft2Start+i*sw,bWY,sw-1,sh-1,8+i,14);
for(let i=0;i<21;i++) add(botRightStart+i*sw,bWY,sw-1,sh-1,27+i,14);

const eucl=(cx,cy)=>Math.min(...cnPx.map(c=>Math.sqrt((cx-c.x)**2+(cy-c.y)**2)));
const bfsDist=s=>BD[s.gy][s.gx];
const gc=t=>t<.25?'#2563eb':t<.5?'#93c5fd':t<.75?'#fca5a5':'#dc2626';
const gL=t=>t<.25?'A':t<.5?'B':t<.75?'C':'D';

let mode='E',mn=0,mx=1;
const getDist=s=>mode==='E'?eucl(s.cx,s.cy):bfsDist(s);
function updMM(){
  let a=Infinity,b=0;
  spots.forEach(s=>{const d=getDist(s);if(d<a)a=d;if(d>b)b=d;});
  mn=a;mx=b;
}

const OX=75,OY=45;
const cv=document.getElementById('pv');
cv.width=lotW+OX+45;
cv.height=lotH+OY+60;
const ctx=cv.getContext('2d');

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(0,0,0,.03)';
  ctx.fillRect(OX,OY,lotW,lotH);
  [0,1,2].forEach(j=>{
    const bdy=isTopY[j]+sh;
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.fillRect(OX+liX,OY+bdy,20*sw,bd);
    ctx.fillRect(OX+riX,OY+bdy,17*sw,bd);
  });
  updMM();
  spots.forEach(s=>{
    ctx.fillStyle=gc((getDist(s)-mn)/(mx-mn));
    ctx.fillRect(OX+s.px,OY+s.py,s.pw,s.ph);
  });
  cnPx.forEach(c=>{
    const px=OX+c.x,py=OY+c.y;
    ctx.strokeStyle='#fff';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#333';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.stroke();
  });
  ctx.font='13px -apple-system,sans-serif';ctx.fillStyle='#555';
  ctx.textAlign='left';  ctx.fillText('좌 엘리베이터',OX,OY-12);
  ctx.textAlign='right'; ctx.fillText('우 엘리베이터',OX+RX_elev+20,OY-12);
  ctx.textAlign='center';
  ctx.fillText('복지관 2',OX+6*sw+sw/2,OY+lotH+20);
  ctx.fillText('복지관 1',OX+wk1x,OY+lotH+20);
  ctx.fillText('미래관',OX+RX_mir,OY+lotH+20);
}

window._sm=m=>{
  mode=m;
  document.getElementById('bE').classList.toggle('on',m==='E');
  document.getElementById('bW').classList.toggle('on',m==='W');
  draw();
};

cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const sc=cv.width/r.width;
  const mx2=(e.clientX-r.left)*sc-OX;
  const my2=(e.clientY-r.top)*sc-OY;
  const hit=spots.find(s=>mx2>=s.px&&mx2<s.px+s.pw&&my2>=s.py&&my2<s.py+s.ph);
  if(hit){
    const d=getDist(hit),t=(d-mn)/(mx-mn);
    const near=cnPx.reduce((b,c)=>Math.sqrt((hit.cx-c.x)**2+(hit.cy-c.y)**2)<Math.sqrt((hit.cx-b.x)**2+(hit.cy-b.y)**2)?c:b);
    document.getElementById('info').textContent=
      `등급 ${gL(t)} | ${mode==='E'?'직선':'보행'} 거리 ${d.toFixed(1)} | 최근접 연결구: ${near.n}`;
  } else document.getElementById('info').textContent='';
});
cv.addEventListener('mouseleave',()=>document.getElementById('info').textContent='');

updMM();draw();
})();
</script>
</body>
</html>
